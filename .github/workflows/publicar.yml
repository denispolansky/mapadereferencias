name: Publicar el archivo

# Cada vez que se suben cambios (incluidos los que sincroniza Obsidian solo),
# el sitio se reconstruye y se publica en GitHub Pages.
on:
  push:
    branches:
      - claude/archivo-vivo-spec-kxl65o
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se sube algo mientras una publicación está en curso, se espera a que
# termine en vez de cancelarla, para no dejar el sitio a medio actualizar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
